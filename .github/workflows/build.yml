name: Build installers

# Runs when you press the green "Run workflow" button on GitHub (Actions tab).
on:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest tests -q
      - name: Build Windows app
        run: >
          pyinstaller --noconfirm --onedir --name TradingOps --paths .
          --collect-data tzdata
          --add-data "backend/dashboard.html;backend"
          --add-data "strategy_engine/sessions.example.json;strategy_engine"
          --hidden-import win32crypt --hidden-import uvicorn.logging
          --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          backend/main.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TradingOps-Windows-Setup
          path: build/Output/TradingOps-Setup.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add our code
        run: |
          flutter create --org com.tradingops --project-name tradingops_mobile --platforms android mobile_build
          cp -r mobile/lib/* mobile_build/lib/
          cd mobile_build
          flutter pub add http shared_preferences
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w").write(s)
          EOF
      - name: Build APK
        working-directory: mobile_build
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TradingOps-Android-APK
          path: mobile_build/build/app/outputs/flutter-apk/app-release.apk
