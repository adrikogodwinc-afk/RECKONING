<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingOps</title>
<style>
:root{--bg:#000;--blue:#00b4ff;--fg:#fff;--dim:#8a99a6;--card:#0b0f14;--bad:#ff5c5c;--ok:#35e08a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:20px;max-width:900px;margin:auto}
h1{color:var(--blue);font-size:22px}h2{font-size:16px;color:var(--blue);margin:0 0 10px}
.card{background:var(--card);border:1px solid #14202b;border-radius:10px;padding:16px;margin:12px 0}
input,button{font:inherit;padding:9px 12px;border-radius:7px;border:1px solid #23415a;background:#000;color:#fff;margin:3px 0;width:100%}
button{background:var(--blue);color:#000;border:0;font-weight:600;cursor:pointer}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dim{color:var(--dim)}.warn{color:#ffcc66}.big{font-size:34px;letter-spacing:6px;color:var(--blue)}
</style></head><body>
<h1>TradingOps</h1>
<div class="card"><h2>Status</h2><div id="st" class="dim">loading…</div></div>

<div class="card"><h2>1. Confirm your trading schedule</h2><div id="sched" class="dim"></div>
<button onclick="confirmSched()">Yes, this schedule is correct</button></div>

<div class="card"><h2>2. Pair your phone</h2>
<button onclick="pair()">Show pairing code</button><div id="code" class="big"></div>
<div class="dim">Type this code in the Android app. It expires in 5 minutes.</div></div>

<div class="card"><h2>3. Add an MT5 account</h2>
<div class="row"><input id="login" placeholder="Account number"><input id="server" placeholder="Broker server name">
<input id="pw" type="password" placeholder="Trading password"><input id="nick" placeholder="Nickname (optional)"></div>
<label class="dim"><input id="demo" type="checkbox" checked style="width:auto"> Demo account</label>
<button onclick="addAcc()">Save account</button><div id="accmsg" class="dim"></div>
<div class="dim">The password is encrypted with Windows and never shown again or sent to your phone.</div></div>

<script>
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadSched(){const s=await j('/local/schedule');
 document.getElementById('sched').innerHTML='Timezone: '+s.timezone+'<br>'+s.raw.sessions.map(x=>x.name+': '+x.start+'–'+x.end).join('<br>')+
 (s.warnings.length?'<br><br><span class="warn">Please check:<br>'+s.warnings.join('<br>')+'</span>':'')+
 '<br><br>Status: '+(s.confirmed?'<b style="color:#35e08a">confirmed</b>':'<b class="warn">not confirmed – nothing will start</b>')}
async function confirmSched(){await j('/local/schedule/confirm',{method:'POST'});loadSched()}
async function pair(){const c=await j('/local/pairing-code',{method:'POST'});document.getElementById('code').textContent=c.code}
async function addAcc(){try{await j('/local/accounts',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({login:+login.value,password:pw.value,server:server.value,nickname:nick.value||null,is_demo:demo.checked})});
 pw.value='';accmsg.textContent='Saved.'}catch(e){accmsg.textContent='Could not save: '+e.message}}
loadSched();
</script></body></html>
